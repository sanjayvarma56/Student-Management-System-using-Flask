<!DOCTYPE html>
<html>
<head>
    <title>Student Marks List</title>
</head>
<body>

    <h2>Student Marks Records</h2>

    <!-- Search Form -->
    <form action="/list" method="GET">
        <input
            type="text"
            name="search"
            placeholder="Search by Name">

        <input
            type="submit"
            value="Search">
    </form>

    <br>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Chemistry</th>
            <th>Physics</th>
            <th>Maths</th>
            <th>Action</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.chemistry }}</td>
            <td>{{ row.physics }}</td>
            <td>{{ row.maths }}</td>

            <td>
                <a href="/edit/{{ row.id }}">Edit</a>

                <a href="/delete/{{ row.id }}"
                   onclick="return confirm('Are you sure you want to delete this record?')">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

    <br><br>

    <a href="/enternew">Add New Student</a>

</body>
</html>
