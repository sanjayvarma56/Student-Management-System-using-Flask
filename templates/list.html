<!DOCTYPE html>
<html>
<head>
<title>Student List</title>
<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="navbar">
<a href="/">Home</a>
<a href="/enternew">Add Student</a>
<a href="/list">Student List</a>
</div>
<div class="container">
<div class="card">
<h2>Student Records</h2>
<form action="/list" method="GET">
<input
type="text"
name="search"
placeholder="Search Student">
<input
type="submit"
value="Search">
</form>
<br>
<table>
<tr>
<th>ID</th>
<th>Name</th>
<th>Address</th>
<th>City</th>
<th>PIN</th>
<th>Action</th>
</tr>
{% for row in rows %}
<tr>
<td>{{ row.id }}</td>
<td>{{ row.name }}</td>
<td>{{ row.addr }}</td>
<td>{{ row.city }}</td>
<td>{{ row.pin }}</td>
<td>
<a
class="btn edit"
href="/edit/{{ row.id }}">
Edit
</a>
<a
class="btn delete"
href="/delete/{{ row.id }}"
onclick="return confirm('Delete Student?')">
Delete
</a>
</td>
</tr>
{% endfor %}
</table>
</div>
</div>
</body>
</html>
