<!DOCTYPE html>
<html>
<head>
<title>Edit Student</title>
<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="navbar">
<a href="/">Home</a>
<a href="/enternew">Add Student</a>
<a href="/list">Student List</a>
</div>
<div class="container">
<div class="card">
<h2>Edit Student</h2>
<form action="/update/{{ row.id }}" method="POST">
<label>Name</label>
<input
type="text"
name="nm"
value="{{ row.name }}">
<label>Address</label>
<input
type="text"
name="add"
value="{{ row.addr }}">
<label>City</label>
<input
type="text"
name="city"
value="{{ row.city }}">
<label>PIN</label>
<input
type="text"
name="pin"
value="{{ row.pin }}">
<input
type="submit"
value="Update Student">
</form>
</div>
</div>
</body>
</html>
